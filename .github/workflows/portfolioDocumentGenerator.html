<template>
    <div class="slds-p-around_medium">
        <template if:false={started}>
            <div class="slds-text-heading_small slds-m-bottom_x-small">Generate Quote PDF</div>
            <p class="slds-text-body_regular slds-m-bottom_medium">Generate a PDF using the selected quote template.</p>
            <lightning-button variant="brand" label="Generate PDF" onclick={handleGenerate} disabled={busy}></lightning-button>
        </template>

        <template if:true={busy}>
            <div class="slds-m-top_medium">
                <lightning-spinner alternative-text="Generating PDF" size="small"></lightning-spinner>
                <p class="slds-align_absolute-center slds-p-top_x-large">{statusText}</p>
            </div>
        </template>

        <template if:true={success}>
            <div class="slds-notify slds-notify_alert slds-alert_success slds-m-top_medium" role="alert">
                <span class="slds-assistive-text">Success</span>
                <h2>PDF generated successfully.</h2>
            </div>
            <div class="slds-m-top_medium">
                <template if:true={fileUrl}>
                    <a class="slds-button slds-button_brand" href={fileUrl} target="_blank" rel="noopener">View PDF</a>
                </template>
                <lightning-button class="slds-m-left_small" label="Generate Again" onclick={reset}></lightning-button>
            </div>
        </template>

        <template if:true={errorMessage}>
            <div class="slds-notify slds-notify_alert slds-alert_error slds-m-top_medium" role="alert">
                <span class="slds-assistive-text">Error</span>
                <div>
                    <div class="slds-text-heading_small">Document generation failed</div>
                    <div class="slds-m-top_x-small slds-text-body_regular" style="white-space: pre-wrap; word-break: break-word;">{errorMessage}</div>
                </div>
            </div>
            <template if:true={technicalDetails}>
                <div class="slds-box slds-theme_default slds-m-top_small">
                    <div class="slds-text-title_bold slds-m-bottom_x-small">Technical details</div>
                    <pre style="white-space: pre-wrap; word-break: break-word; max-height: 18rem; overflow: auto;">{technicalDetails}</pre>
                </div>
            </template>
            <lightning-button class="slds-m-top_medium" label="Try Again" onclick={reset}></lightning-button>
        </template>
    </div>
</template>
